version: '3.8'

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: whitemist_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: whitemist_dishwasher_db
      MYSQL_USER: whitemist_user
      MYSQL_PASSWORD: whitemist_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express REST API Service
  backend_api:
    build: .
    container_name: whitemist_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: whitemist_dishwasher_db
      JWT_SECRET: whitemist_dishwasher_super_secret_jwt_key_2026_prod
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  mysql_data:
